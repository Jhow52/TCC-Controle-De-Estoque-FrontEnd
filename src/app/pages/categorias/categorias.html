<div class="topbar"><h2>Sistema de Gestão de Estoque</h2></div>
<div class="page-content">
  <div class="toolbar">
    <div class="page-title" style="margin:0">Categorias</div>
    <button class="btn btn-primary" (click)="openCreate()">+ Nova Categoria</button>
  </div>
  <div class="alert alert-success" *ngIf="success">{{ success }}</div>
  <div class="alert alert-error" *ngIf="error">{{ error }}</div>
  <div class="table-card">
    <table>
      <thead><tr><th>#</th><th>Nome</th><th>Ações</th></tr></thead>
      <tbody>
        <tr *ngFor="let c of categories">
          <td>{{ c.id }}</td>
          <td><strong>{{ c.name }}</strong></td>
          <td>
            <button class="btn-icon" (click)="openEdit(c)">✏️</button>
            <button class="btn-icon" (click)="delete(c.id)">🗑️</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<div class="modal-overlay" *ngIf="showModal" (click)="showModal=false">
  <div class="modal" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3>{{ editId ? 'Editar' : 'Nova' }} Categoria</h3>
      <button class="btn-icon" (click)="showModal=false">✕</button>
    </div>
    <div class="form-group"><label>Nome</label><input class="form-control" [(ngModel)]="form.name" placeholder="Nome da categoria" /></div>
    <div class="form-group"><label>Descrição</label><input class="form-control" [(ngModel)]="form.description" placeholder="Descrição da categoria" /></div>
    <div class="modal-footer">
      <button class="btn btn-secondary" (click)="showModal=false">Cancelar</button>
      <button class="btn btn-primary" (click)="save()">{{ editId ? 'Salvar' : 'Criar' }}</button>
    </div>
  </div>
</div>
