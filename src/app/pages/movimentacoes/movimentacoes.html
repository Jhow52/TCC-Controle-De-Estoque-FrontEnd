<div class="topbar"><h2>Sistema de Gestão de Estoque</h2></div>
<div class="page-content">
  <div class="page-title">Movimentações de Estoque</div>
  <div class="alert alert-success" *ngIf="success">{{ success }}</div>
  <div class="alert alert-error" *ngIf="error">{{ error }}</div>

  <div class="table-card">
    <h3>Registrar Movimentação</h3>
    <div class="form-row">
      <div class="form-group">
        <label>Produto</label>
        <select class="form-control" [(ngModel)]="form.productId">
          <option [value]="0">Selecione um produto</option>
          <option *ngFor="let p of products" [value]="p.id">{{ p.name }}</option>
        </select>
      </div>
      <div class="form-group">
        <label>Tipo de Movimentação</label>
        <select class="form-control" [(ngModel)]="type">
          <option value="ENTRADA">↑ Entrada</option>
          <option value="SAIDA">↓ Saída</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Quantidade</label><input class="form-control" type="number" [(ngModel)]="form.quantity" /></div>
      <div class="form-group"><label>Observação</label><input class="form-control" [(ngModel)]="form.notes" placeholder="Opcional" /></div>
    </div>
    <button class="btn btn-primary" (click)="submit()">Registrar Movimentação</button>
  </div>

  <div class="table-card">
    <h3>Histórico de Movimentações</h3>
    <table>
      <thead><tr><th>Produto</th><th>Tipo</th><th>Quantidade</th><th>Observação</th></tr></thead>
      <tbody>
        <tr *ngFor="let m of movements">
          <td>{{ m.productName }}</td>
          <td><span class="badge" [class]="m.type === 'ENTRADA' ? 'badge-green' : 'badge-red'">{{ m.type === 'ENTRADA' ? '↑ Entrada' : '↓ Saída' }}</span></td>
          <td>{{ m.quantity }}</td>
          <td>{{ m.notes }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
