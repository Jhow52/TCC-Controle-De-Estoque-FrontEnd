<div class="auth-container">
  <div class="auth-card">
    <div style="font-size:32px;margin-bottom:12px">🏭</div>
    <div class="auth-title">Bem-vindo de volta</div>
    <div class="auth-sub">Acesse o Sistema de Gestão de Estoque</div>
    <div class="alert alert-error" *ngIf="error">{{ error }}</div>
    <div class="form-group">
      <label>Email</label>
      <input class="form-control" type="email" [(ngModel)]="email" placeholder="seu@email.com" />
    </div>
    <div class="form-group">
      <label>Senha</label>
      <input class="form-control" type="password" [(ngModel)]="password" placeholder="••••••••" (keyup.enter)="submit()" />
    </div>
    <button class="btn btn-primary" style="width:100%" (click)="submit()" [disabled]="loading">
      {{ loading ? 'Entrando...' : 'Entrar' }}
    </button>
    <div class="auth-link">Não tem conta? <a routerLink="/register">Cadastrar</a></div>
  </div>
</div>
